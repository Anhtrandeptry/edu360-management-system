# =========================
# LOCAL DATABASE CONFIG
# =========================
spring.datasource.url=jdbc:mysql://localhost:3306/edu360?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# =========================
# JWT CONFIG
# =========================
edu360.app.jwtCookieName=edu360_jwt
edu360.app.jwtSecret=your_secret_key_here_should_be_at_least_256_bits_long_for_security
edu360.app.jwtExpirationMs=86400000

# =========================
# MAIL SERVER CONFIG (Local Development)
# =========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password

# =========================
# VIETQR CONFIG (Local Development)
# =========================
payment.vietqr.bankCode=970422
payment.vietqr.accountNumber=0123456789
payment.vietqr.accountName=TEST ACCOUNT
payment.vietqr.templateId=compact
payment.vietqr.baseUrl=https://api.vietqr.io/v2

# =========================
# GOOGLE OAUTH2 CONFIG (Local Development)
# =========================
google.client-id=your-google-client-id
google.client-secret=your-google-client-secret

# =========================
# ENROLLMENT CONFIG
# =========================
enrollment.requirePaid=false

# =========================
# CLOUDINARY CONFIG (Local Development)
# =========================
cloudinary.cloud-name=your-cloud-name
cloudinary.api-key=your-api-key
cloudinary.api-secret=your-api-secret
