# MySQL Database for Integration Testing
# Use a separate test database, NOT production database!
spring.datasource.url=jdbc:mysql://localhost:3306/edu360_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=your_password_here

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# JWT Configuration (use test values)
jwt.secret=testSecretKeyForIntegrationTestingPurposesOnly123456789
jwt.expiration=3600000

# Mail Configuration (disable for tests)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test
spring.mail.password=test

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.fpt.capstone.edu360managementsystem=DEBUG
